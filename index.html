<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostWatch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 2rem; }
    .logo {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6366f1;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      color: #7a8499;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .dot { color: #6366f1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PostWatch</div>
    <h1>Hello, PostWatch<span class="dot">.</span></h1>
    <p>Cross-platform service control panel. Coming soon.</p>
  </div>
</body>
</html>
